[project]
name = "stock-advisor"
version = "1.0.0"
description = "A股/期货 AI 分析系统"
requires-python = ">=3.11"

[project.scripts]
stock-advisor = "cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["cli"]
packages = ["agent", "admin", "application", "domain", "domain.models", "infrastructure", "repository", "scheduler", "prompts"]
