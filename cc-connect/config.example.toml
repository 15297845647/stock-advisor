# cc-connect 配置示例
# 复制到 ~/.cc-connect/config.toml 并修改

[[projects]]
name = "stock-advisor"
work_dir = "/opt/stock-advisor"

[projects.agent]
type = "acp"

[projects.agent.options]
command = "/opt/stock-advisor/.venv/bin/python"
args = ["agent/main.py"]
env = { MINIMAX_API_KEY = "your-minimax-api-key", PYTHONPATH = "/opt/stock-advisor", DB_PATH = "/opt/stock-advisor/data/stock_advisor.db" }

[[projects.platforms]]
type = "weixin"

[projects.platforms.options]
# token 由 cc-connect weixin setup 扫码后自动填入
token = ""
# 允许使用机器人的微信用户ID，逗号分隔；"*" 表示不限制
allow_from = "*"
