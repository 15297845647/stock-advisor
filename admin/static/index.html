<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stock Advisor — 管理后台</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
  <style>
    [x-cloak] { display: none !important; }
    body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    .fade-in { animation: fadeIn .25s ease-out; }
    @keyframes fadeIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen" x-data="admin()" x-cloak>

  <!-- 登录遮罩 -->
  <template x-if="!token">
    <div class="flex items-center justify-center min-h-screen">
      <div class="bg-white rounded-2xl shadow-xl p-8 w-full max-w-sm fade-in">
        <h1 class="text-2xl font-bold text-center mb-6">Stock Advisor</h1>
        <p class="text-gray-500 text-center text-sm mb-6">管理后台登录</p>
        <input type="password" x-model="password" @keydown.enter="doLogin()"
               placeholder="请输入管理密码" class="w-full border border-gray-200 rounded-lg px-4 py-2.5 mb-4 focus:outline-none focus:ring-2 focus:ring-blue-500/40">
        <button @click="doLogin()" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2.5 rounded-lg font-medium transition">登 录</button>
        <p x-show="loginErr" class="text-red-500 text-sm text-center mt-3" x-text="loginErr"></p>
      </div>
    </div>
  </template>

  <!-- 主体 -->
  <template x-if="token">
    <div class="flex min-h-screen">
      <!-- 侧边栏 -->
      <aside class="w-56 bg-white border-r border-gray-100 py-6 px-4 flex flex-col">
        <h1 class="text-lg font-bold mb-8 px-2">Stock Advisor</h1>
        <nav class="flex flex-col gap-1 flex-1">
          <template x-for="item in menu" :key="item.key">
            <button @click="page=item.key; item.load && item.load()"
                    :class="page===item.key ? 'bg-blue-50 text-blue-700 font-medium' : 'text-gray-600 hover:bg-gray-50'"
                    class="text-left px-3 py-2 rounded-lg text-sm transition" x-text="item.label"></button>
          </template>
        </nav>
        <button @click="logout()" class="text-left px-3 py-2 text-gray-400 hover:text-red-500 text-sm mt-4 transition">退出登录</button>
      </aside>

      <!-- 内容区 -->
      <main class="flex-1 p-8 overflow-auto">

        <!-- Dashboard -->
        <div x-show="page==='dashboard'" class="fade-in">
          <h2 class="text-xl font-bold mb-6">仪表盘</h2>
          <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
            <template x-for="s in stats" :key="s.label">
              <div class="bg-white rounded-xl shadow-sm p-5 border border-gray-100">
                <div class="text-sm text-gray-500" x-text="s.label"></div>
                <div class="text-2xl font-bold mt-1" x-text="s.value"></div>
              </div>
            </template>
          </div>
          <div class="bg-white rounded-xl shadow-sm p-5 border border-gray-100">
            <h3 class="font-medium mb-3">系统信息</h3>
            <div class="grid grid-cols-2 gap-x-8 gap-y-2 text-sm">
              <span class="text-gray-500">LLM 模型</span><span x-text="dash.llm_model||'-'"></span>
              <span class="text-gray-500">API Key 已设置</span><span x-text="dash.llm_key_set?'是':'否'"></span>
              <span class="text-gray-500">数据库大小</span><span x-text="(dash.db_size_mb||0)+' MB'"></span>
              <span class="text-gray-500">最后活动时间</span><span x-text="dash.last_activity||'无'"></span>
            </div>
          </div>
        </div>

        <!-- 用户管理（含 Bot 绑定）-->
        <div x-show="page==='users'" class="fade-in">
          <h2 class="text-xl font-bold mb-6">用户管理</h2>

          <!-- 列表视图 -->
          <div x-show="!selectedUser">

            <!-- 操作栏：添加 + 重启 -->
            <div class="flex items-start gap-4 mb-6">
              <button @click="showAddUser=!showAddUser"
                      class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm hover:bg-blue-700 transition">
                <span x-text="showAddUser?'收起':'+ 添加用户'"></span>
              </button>
              <button @click="restartCC()" class="bg-gray-800 text-white px-4 py-2 rounded-lg text-sm hover:bg-gray-900 transition">
                重启 cc-connect
              </button>
              <span x-show="restartMsg" class="text-green-600 text-sm leading-9" x-text="restartMsg"></span>
            </div>

            <!-- 添加用户表单（含 Bot 字段）-->
            <div x-show="showAddUser" class="bg-white rounded-xl shadow-sm p-5 border border-gray-100 mb-6 max-w-2xl fade-in">
              <h3 class="font-medium mb-2">添加新用户</h3>
              <p class="text-xs text-gray-400 mb-4">创建用户时同步配置 Bot 接入。先在服务器执行 <code class="bg-gray-100 px-1 rounded">cc-connect weixin setup --project bot-用户ID</code> 获取 token。</p>
              <div class="grid grid-cols-2 gap-4">
                <div>
                  <label class="text-sm text-gray-500 block mb-1">用户ID <span class="text-red-400">*</span></label>
                  <input type="text" x-model="newUser.user_id" placeholder="英文标识，如 zhangsan"
                         class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/40">
                </div>
                <div>
                  <label class="text-sm text-gray-500 block mb-1">昵称</label>
                  <input type="text" x-model="newUser.nickname" placeholder="显示名"
                         class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/40">
                </div>
                <div>
                  <label class="text-sm text-gray-500 block mb-1">风险偏好</label>
                  <select x-model="newUser.risk_level" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm">
                    <option value="conservative">保守</option>
                    <option value="moderate">稳健</option>
                    <option value="aggressive">激进</option>
                  </select>
                </div>
                <div>
                  <label class="text-sm text-gray-500 block mb-1">交易风格</label>
                  <select x-model="newUser.trade_style" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm">
                    <option value="day">日内（养家短线）</option>
                    <option value="swing">波段（养家短线）</option>
                    <option value="long">中长线</option>
                  </select>
                </div>
                <div>
                  <label class="text-sm text-gray-500 block mb-1">Bot Token</label>
                  <input type="text" x-model="newUser.bot_token" placeholder="ilink token（可稍后补填）"
                         class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-blue-500/40">
                </div>
                <div>
                  <label class="text-sm text-gray-500 block mb-1">Bot Account ID</label>
                  <input type="text" x-model="newUser.bot_account_id" placeholder="account_id（可稍后补填）"
                         class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-blue-500/40">
                </div>
              </div>
              <div class="mt-4 flex items-center gap-3">
                <button @click="createUser()" class="bg-blue-600 text-white px-5 py-2 rounded-lg text-sm hover:bg-blue-700 transition">创建用户</button>
                <p x-show="createUserMsg" class="text-sm" :class="createUserErr?'text-red-500':'text-green-600'" x-text="createUserMsg"></p>
              </div>
            </div>

            <!-- 用户列表 -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
              <table class="w-full text-sm">
                <thead class="bg-gray-50 text-gray-500 text-left">
                  <tr>
                    <th class="px-4 py-3 font-medium">用户ID</th>
                    <th class="px-4 py-3 font-medium">昵称</th>
                    <th class="px-4 py-3 font-medium">风险偏好</th>
                    <th class="px-4 py-3 font-medium">交易风格</th>
                    <th class="px-4 py-3 font-medium">Bot 状态</th>
                    <th class="px-4 py-3 font-medium">关注数</th>
                    <th class="px-4 py-3 font-medium">注册时间</th>
                    <th class="px-4 py-3 font-medium">操作</th>
                  </tr>
                </thead>
                <tbody>
                  <template x-for="u in users" :key="u.wechat_id">
                    <tr class="border-t border-gray-50 hover:bg-gray-50/50">
                      <td class="px-4 py-3 font-mono text-xs" x-text="u.wechat_id"></td>
                      <td class="px-4 py-3" x-text="u.nickname||'-'"></td>
                      <td class="px-4 py-3" x-text="u.risk_level"></td>
                      <td class="px-4 py-3" x-text="u.trade_style"></td>
                      <td class="px-4 py-3">
                        <span :class="u.bot_status==='active'?'bg-green-100 text-green-700': u.bot_status==='pending'?'bg-yellow-100 text-yellow-700':'bg-gray-100 text-gray-500'"
                              class="px-2 py-0.5 rounded-full text-xs font-medium"
                              x-text="u.bot_status==='active'?'已绑定': u.bot_status==='pending'?'待绑定':'未配置'"></span>
                      </td>
                      <td class="px-4 py-3" x-text="u.watch_count"></td>
                      <td class="px-4 py-3 text-gray-400 text-xs" x-text="u.created_at?.slice(0,10)"></td>
                      <td class="px-4 py-3 space-x-2">
                        <button @click="viewUser(u.wechat_id)" class="text-blue-600 hover:underline text-xs">详情</button>
                        <button @click="deleteUser(u.wechat_id, u.nickname||u.wechat_id)" class="text-red-500 hover:underline text-xs">删除</button>
                      </td>
                    </tr>
                  </template>
                </tbody>
              </table>
              <div x-show="users.length===0" class="text-center py-12 text-gray-400">暂无用户，点击"添加用户"开始</div>
            </div>
          </div>

          <!-- 用户详情 -->
          <div x-show="selectedUser" class="fade-in">
            <button @click="_stopSetupPoll(); selectedUser=null" class="text-sm text-blue-600 hover:underline mb-4 inline-block">&larr; 返回列表</button>
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
              <!-- 基本信息 -->
              <div class="bg-white rounded-xl shadow-sm p-5 border border-gray-100">
                <h3 class="font-medium mb-4">用户信息</h3>
                <div class="space-y-3 text-sm">
                  <div><span class="text-gray-500 w-20 inline-block">用户ID</span><span class="font-mono" x-text="selectedUser.profile?.wechat_id"></span></div>
                  <div><span class="text-gray-500 w-20 inline-block">昵称</span>
                    <input x-model="editProfile.nickname" class="border border-gray-200 rounded px-2 py-1 w-40">
                  </div>
                  <div><span class="text-gray-500 w-20 inline-block">风险偏好</span>
                    <select x-model="editProfile.risk_level" class="border border-gray-200 rounded px-2 py-1">
                      <option value="conservative">保守</option>
                      <option value="moderate">稳健</option>
                      <option value="aggressive">激进</option>
                    </select>
                  </div>
                  <div><span class="text-gray-500 w-20 inline-block">交易风格</span>
                    <select x-model="editProfile.trade_style" class="border border-gray-200 rounded px-2 py-1">
                      <option value="day">日内（养家短线）</option>
                      <option value="swing">波段（养家短线）</option>
                      <option value="long">中长线</option>
                    </select>
                  </div>
                  <button @click="saveProfile()" class="bg-blue-600 text-white px-4 py-1.5 rounded-lg text-sm hover:bg-blue-700 transition">保存</button>
                  <span x-show="profileSaved" class="text-green-600 text-sm ml-2">已保存</span>
                </div>
              </div>

              <!-- Bot 绑定信息 -->
              <div class="bg-white rounded-xl shadow-sm p-5 border border-gray-100">
                <h3 class="font-medium mb-4">Bot 绑定</h3>
                <template x-if="selectedUser.bot">
                  <div class="space-y-3 text-sm">
                    <div class="flex items-center gap-2">
                      <span class="text-gray-500 w-24 inline-block">状态</span>
                      <span :class="selectedUser.bot.status==='active'?'bg-green-100 text-green-700':'bg-yellow-100 text-yellow-700'"
                            class="px-2 py-0.5 rounded-full text-xs font-medium"
                            x-text="selectedUser.bot.status==='active'?'已绑定':'待绑定'"></span>
                    </div>
                    <div><span class="text-gray-500 w-24 inline-block">Bot 名称</span><span class="font-mono text-xs" x-text="selectedUser.bot.name"></span></div>

                    <!-- 扫码绑定区域 -->
                    <div x-show="!showManualBot">
                      <template x-if="setupStatus==='idle' || setupStatus==='none'">
                        <div>
                          <button @click="startSetup()" class="bg-green-600 text-white px-4 py-1.5 rounded-lg text-sm hover:bg-green-700 transition">
                            <span x-text="selectedUser.bot.status==='active'?'重新绑定':'开始绑定'"></span>
                          </button>
                          <button @click="showManualBot=true" class="text-gray-400 hover:text-gray-600 text-xs ml-3">手动填写 Token</button>
                        </div>
                      </template>
                      <template x-if="setupStatus==='waiting'">
                        <div class="text-center py-2">
                          <div class="inline-block animate-spin rounded-full h-6 w-6 border-2 border-blue-500 border-t-transparent mb-2"></div>
                          <p class="text-gray-500 text-sm">正在生成二维码...</p>
                        </div>
                      </template>
                      <template x-if="setupStatus==='qr_ready'">
                        <div class="text-center">
                          <p class="text-blue-600 font-medium mb-2">请用微信扫描二维码</p>
                          <img :src="'/api/users/'+selectedUser.profile?.wechat_id+'/bot/qr?t='+Date.now()"
                               class="mx-auto border border-gray-200 rounded-lg" style="max-width:220px;">
                          <p class="text-gray-400 text-xs mt-2">
                            剩余 <span x-text="Math.max(0, 300 - (setupElapsed||0))"></span> 秒
                          </p>
                        </div>
                      </template>
                      <template x-if="setupStatus==='success'">
                        <div class="bg-green-50 border border-green-200 rounded-lg p-3 text-center">
                          <p class="text-green-700 font-medium">绑定成功！</p>
                          <p class="text-green-600 text-xs mt-1">Token 已写入，cc-connect 已自动重启</p>
                        </div>
                      </template>
                      <template x-if="setupStatus==='failed'">
                        <div class="bg-red-50 border border-red-200 rounded-lg p-3">
                          <p class="text-red-600 text-sm" x-text="setupMsg||'绑定失败'"></p>
                          <button @click="setupStatus='idle'" class="text-blue-600 text-xs mt-2 hover:underline">重试</button>
                        </div>
                      </template>
                    </div>

                    <!-- 手动编辑 Token（高级模式）-->
                    <div x-show="showManualBot" class="border-t border-gray-100 pt-3 mt-2">
                      <div class="flex items-center justify-between mb-2">
                        <span class="text-gray-500 text-xs">手动填写 Token</span>
                        <button @click="showManualBot=false" class="text-blue-600 text-xs hover:underline">返回扫码绑定</button>
                      </div>
                      <div class="space-y-2">
                        <div>
                          <label class="text-gray-500 text-xs block mb-1">Token</label>
                          <input x-model="editBot.token" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm font-mono">
                        </div>
                        <div>
                          <label class="text-gray-500 text-xs block mb-1">Account ID</label>
                          <input x-model="editBot.account_id" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm font-mono">
                        </div>
                        <button @click="saveBot()" class="bg-blue-600 text-white px-4 py-1.5 rounded-lg text-sm hover:bg-blue-700 transition">保存</button>
                        <span x-show="botSaved" class="text-green-600 text-sm ml-2">已保存</span>
                      </div>
                    </div>
                  </div>
                </template>
                <template x-if="!selectedUser.bot">
                  <p class="text-gray-400 text-sm">该用户暂无 Bot 绑定</p>
                </template>
              </div>

              <!-- 关注列表 -->
              <div class="bg-white rounded-xl shadow-sm p-5 border border-gray-100">
                <h3 class="font-medium mb-4">关注列表</h3>
                <div class="space-y-1.5 text-sm max-h-60 overflow-auto">
                  <template x-for="w in selectedUser.watchlist||[]" :key="w.stock_code">
                    <div class="flex justify-between items-center py-1">
                      <span><span class="font-mono text-xs text-gray-500" x-text="w.stock_code"></span> <span x-text="w.stock_name||''"></span></span>
                      <span class="text-gray-400 text-xs" x-text="w.added_at?.slice(0,10)"></span>
                    </div>
                  </template>
                  <div x-show="!selectedUser.watchlist?.length" class="text-gray-400">暂无关注</div>
                </div>
              </div>
              <!-- 记忆 -->
              <div class="bg-white rounded-xl shadow-sm p-5 border border-gray-100">
                <h3 class="font-medium mb-4">长期记忆</h3>
                <div class="space-y-2 text-sm max-h-60 overflow-auto">
                  <template x-for="m in selectedUser.memories||[]" :key="m.created_at">
                    <div class="bg-gray-50 rounded-lg p-2.5">
                      <div class="text-xs text-gray-400 mb-1" x-text="m.category + ' · ' + m.created_at?.slice(0,10)"></div>
                      <div x-text="m.content"></div>
                    </div>
                  </template>
                  <div x-show="!selectedUser.memories?.length" class="text-gray-400">暂无记忆</div>
                </div>
              </div>
            </div>
            <!-- 对话历史 -->
            <div class="bg-white rounded-xl shadow-sm p-5 border border-gray-100 mt-6">
              <h3 class="font-medium mb-4">近期对话</h3>
              <div class="space-y-2 max-h-96 overflow-auto">
                <template x-for="(c,i) in selectedUser.recent_chat||[]" :key="i">
                  <div :class="c.role==='user'?'bg-blue-50 ml-8':'bg-gray-50 mr-8'" class="rounded-lg p-3 text-sm">
                    <div class="text-xs text-gray-400 mb-1" x-text="(c.role==='user'?'用户':'AI') + ' · ' + c.created_at"></div>
                    <div class="whitespace-pre-wrap" x-text="c.content"></div>
                  </div>
                </template>
                <div x-show="!selectedUser.recent_chat?.length" class="text-gray-400 text-sm">暂无对话</div>
              </div>
            </div>
          </div>
        </div>

        <!-- 数据源 -->
        <div x-show="page==='data-sources'" class="fade-in">
          <div class="flex items-center justify-between mb-6">
            <h2 class="text-xl font-bold">数据源管理</h2>
            <div class="flex items-center gap-3">
              <select x-model.number="ds.period" @change="loadDataSources()"
                      class="text-sm border border-gray-200 rounded-lg px-3 py-1.5">
                <option :value="6">近 6 小时</option>
                <option :value="24">近 24 小时</option>
                <option :value="72">近 3 天</option>
                <option :value="168">近 7 天</option>
              </select>
              <button @click="probeAllSources()" :disabled="ds.probing"
                      class="text-sm bg-white border border-gray-200 hover:bg-gray-50 px-3 py-1.5 rounded-lg transition disabled:opacity-50">
                <span x-show="!ds.probing">🔄 立即探活</span>
                <span x-show="ds.probing">探活中...</span>
              </button>
              <button @click="reloadDataSourceConfig()"
                      class="text-sm bg-white border border-gray-200 hover:bg-gray-50 px-3 py-1.5 rounded-lg transition">
                ⚙️ 重载配置
              </button>
              <button @click="loadDataSources()"
                      class="text-sm bg-blue-600 text-white hover:bg-blue-700 px-3 py-1.5 rounded-lg transition">
                刷新
              </button>
            </div>
          </div>

          <p x-show="ds.msg" :class="ds.msgOk ? 'text-green-600' : 'text-red-500'"
             class="text-sm mb-4" x-text="ds.msg"></p>

          <!-- 概览卡片 -->
          <div class="grid grid-cols-2 md:grid-cols-5 gap-4 mb-6">
            <div class="bg-white rounded-xl shadow-sm p-4 border border-gray-100">
              <div class="text-xs text-gray-500">健康 / 总数</div>
              <div class="text-xl font-bold mt-1">
                <span class="text-green-600" x-text="ds.summary?.sources_healthy ?? '-'"></span>
                <span class="text-gray-400"> / </span>
                <span x-text="ds.summary?.sources_total ?? '-'"></span>
              </div>
            </div>
            <div class="bg-white rounded-xl shadow-sm p-4 border border-gray-100">
              <div class="text-xs text-gray-500">熔断中</div>
              <div class="text-xl font-bold mt-1 text-red-500"
                   x-text="ds.summary?.sources_broken ?? '-'"></div>
            </div>
            <div class="bg-white rounded-xl shadow-sm p-4 border border-gray-100">
              <div class="text-xs text-gray-500"><span x-text="ds.period"></span>h 调用数</div>
              <div class="text-xl font-bold mt-1"
                   x-text="(ds.summary?.total_calls || 0).toLocaleString()"></div>
            </div>
            <div class="bg-white rounded-xl shadow-sm p-4 border border-gray-100">
              <div class="text-xs text-gray-500">成功率</div>
              <div class="text-xl font-bold mt-1">
                <span x-text="((ds.summary?.success_rate || 0) * 100).toFixed(1) + '%'"></span>
              </div>
            </div>
            <div class="bg-white rounded-xl shadow-sm p-4 border border-gray-100">
              <div class="text-xs text-gray-500">平均延迟</div>
              <div class="text-xl font-bold mt-1">
                <span x-text="(ds.summary?.avg_latency_ms || 0).toFixed(0) + 'ms'"></span>
              </div>
            </div>
          </div>

          <!-- 源状态表 -->
          <div class="bg-white rounded-xl shadow-sm p-5 border border-gray-100 mb-6">
            <h3 class="font-medium mb-4">源状态</h3>
            <div class="overflow-x-auto">
              <table class="w-full text-sm">
                <thead>
                  <tr class="text-left text-gray-500 border-b border-gray-100">
                    <th class="pb-2 pr-4">状态</th>
                    <th class="pb-2 pr-4">名称</th>
                    <th class="pb-2 pr-4">调用</th>
                    <th class="pb-2 pr-4">成功率</th>

    // logs
    logFiles: [],
    logFile: 'agent.log',
    logLevel: '',
    logSearch: '',
    logLines: '300',
    logContent: [],
    logAutoRefresh: false,
    _logRefreshTimer: null,

    // config
    cfg: {},
    newPassword: '',
    cfgSaved: false,
    cfgSavedMsg: '',

    // strategy config
    strategyCfg: {},
    strategySaved: false,
    strategyMsg: '',

    // midlong strategy config
    midlongCfg: {},
    midlongSaved: false,
    midlongMsg: '',

    // data sources
    ds: {
      summary: null,
      health: [],
      stats: [],
      opStats: [],
      failures: [],
      config: null,
      loading: false,
      msg: '',
      msgOk: false,
      probing: false,
      probeResults: null,
      period: 24,
    },
    _dsRefreshTimer: null,

    menu: [
      { key: 'dashboard', label: '仪表盘' },
      { key: 'users', label: '用户管理' },
      { key: 'strategy', label: '策略配置' },
      { key: 'data-sources', label: '数据源' },
      { key: 'logs', label: '日志查看' },
      { key: 'config', label: '配置管理' },
    ],

    async init() {
      this.menu[0].load = () => this.loadDashboard();
      this.menu[1].load = () => this.loadUsers();
      this.menu[2].load = () => { this.loadStrategy(); this.loadMidlong(); };
      this.menu[3].load = () => this.loadDataSources();
      this.menu[4].load = () => this.loadLogFiles();
      this.menu[5].load = () => this.loadConfig();
      if (this.token) await this.loadDashboard();
    },

    headers() { return { 'Authorization': 'Bearer ' + this.token, 'Content-Type': 'application/json' } },

    async doLogin() {
      this.loginErr = '';
      try {
        const r = await fetch('/api/login', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({password:this.password}) });
        if (!r.ok) { this.loginErr = '密码错误'; return; }
        const d = await r.json();
        this.token = d.token;
        localStorage.setItem('admin_token', d.token);
        await this.loadDashboard();
      } catch(e) { this.loginErr = '请求失败'; }
    },

    logout() { this.token=''; localStorage.removeItem('admin_token'); },

    async api(path, opts={}) {
      const r = await fetch(path, { ...opts, headers: this.headers() });
      if (r.status===401) { this.logout(); return null; }
      return r.json();
    },

    // ── Dashboard ──
    async loadDashboard() {
      const d = await this.api('/api/dashboard');
      if (!d) return;
      this.dash = d;
      this.stats = [
        { label: '用户数', value: d.users },
        { label: '关注股票数', value: d.watchlist_items },
        { label: '今日报告', value: d.today_reports || 0 },
        { label: '今日对话', value: d.today_chats },
      ];
    },

    // ── Users ──
    async loadUsers() {
      const d = await this.api('/api/users');
      if (d) this.users = d;
    },

    async createUser() {
      this.createUserMsg = ''; this.createUserErr = false;
      if (!this.newUser.user_id.trim()) { this.createUserMsg = '请输入用户ID'; this.createUserErr = true; return; }
      try {
        const r = await fetch('/api/users', { method:'POST', headers:this.headers(), body:JSON.stringify(this.newUser) });
        const d = await r.json();
        if (!r.ok) { this.createUserMsg = d.detail || '创建失败'; this.createUserErr = true; return; }
        this.createUserMsg = `用户 ${d.user_id} 已创建（Bot: ${d.bot_status}），请重启 cc-connect 生效`;
        this.newUser = { user_id: '', nickname: '', risk_level: 'moderate', trade_style: 'swing', bot_token: '', bot_account_id: '' };
        await this.loadUsers();
      } catch(e) { this.createUserMsg = '请求失败'; this.createUserErr = true; }
    },

    async deleteUser(id, name) {
      if (!confirm(`确定删除用户 "${name}"？将同时删除其 Bot 配置、关注列表、记忆和对话记录。`)) return;
      await this.api('/api/users/' + id, { method:'DELETE' });
      await this.loadUsers();
    },

    async viewUser(id) {
      const d = await this.api('/api/users/' + id);
      if (!d) return;
      this.selectedUser = d;
      this.editProfile = {
        nickname: d.profile?.nickname || '',
        risk_level: d.profile?.risk_level || 'moderate',
        trade_style: d.profile?.trade_style || 'swing',
      };
      this.editBot = {
        token: d.bot?.token || '',
        account_id: d.bot?.account_id || '',
      };
      this.profileSaved = false;
      this.botSaved = false;
      this.showManualBot = false;
      this.setupStatus = 'idle';
      this.setupMsg = '';
      this._stopSetupPoll();
    },

    async saveProfile() {
      const id = this.selectedUser?.profile?.wechat_id;
      if (!id) return;
      await this.api('/api/users/' + id, { method:'PUT', body:JSON.stringify(this.editProfile) });
      this.profileSaved = true;
      setTimeout(() => this.profileSaved = false, 2000);
    },

    async saveBot() {
      const id = this.selectedUser?.profile?.wechat_id;
      if (!id) return;
      await this.api('/api/users/' + id + '/bot', { method:'PUT', body:JSON.stringify(this.editBot) });
      this.botSaved = true;
      const d = await this.api('/api/users/' + id);
      if (d) { this.selectedUser = d; this.editBot = { token: d.bot?.token || '', account_id: d.bot?.account_id || '' }; }
      setTimeout(() => this.botSaved = false, 2000);
    },

    async startSetup() {
      const id = this.selectedUser?.profile?.wechat_id;
      if (!id) return;
      this.setupStatus = 'waiting'; this.setupMsg = ''; this.setupElapsed = 0;
      try {
        const r = await fetch('/api/users/' + id + '/bot/setup', { method:'POST', headers:this.headers() });
        if (!r.ok) {
          const d = await r.json();
          this.setupStatus = 'failed'; this.setupMsg = d.detail || '启动失败'; return;
        }
        this._pollSetupStatus(id);
      } catch(e) { this.setupStatus = 'failed'; this.setupMsg = '请求失败'; }
    },

    _pollSetupStatus(userId) {
      if (this._setupPollTimer) clearInterval(this._setupPollTimer);
      this._setupPollTimer = setInterval(async () => {
        const d = await this.api('/api/users/' + userId + '/bot/setup/status');
        if (!d) { this._stopSetupPoll(); return; }
        this.setupElapsed = d.elapsed || 0;

        if (d.status === 'qr_ready') {
          this.setupStatus = 'qr_ready';
        } else if (d.status === 'success') {
          this.setupStatus = 'success';
          this._stopSetupPoll();
          const ud = await this.api('/api/users/' + userId);
          if (ud) { this.selectedUser = ud; this.editBot = { token: ud.bot?.token || '', account_id: ud.bot?.account_id || '' }; }
        } else if (d.status === 'failed') {
          this.setupStatus = 'failed'; this.setupMsg = d.message || '绑定失败';
          this._stopSetupPoll();
        } else if (d.status === 'none') {
          this.setupStatus = 'idle';
          this._stopSetupPoll();
        }
      }, 2000);
    },

    _stopSetupPoll() {
      if (this._setupPollTimer) { clearInterval(this._setupPollTimer); this._setupPollTimer = null; }
    },

    async restartCC() {
      this.restartMsg = '重启中...';
      const d = await this.api('/api/restart', { method:'POST' });
      this.restartMsg = d?.message || '已发送重启命令';
      setTimeout(() => this.restartMsg = '', 5000);
    },

    // ── Logs ──
    async loadLogFiles() {
      const d = await this.api('/api/logs');
      if (d) {
        this.logFiles = d;
        if (d.length && !d.find(f => f.name === this.logFile)) {
          this.logFile = d[0].name;
        }
      }
      await this.loadLogs();
    },

    async loadLogs() {
      const params = new URLSearchParams({
        file: this.logFile,
        lines: this.logLines,
        level: this.logLevel,
        search: this.logSearch,
      });
      const d = await this.api('/api/logs/content?' + params.toString());
      if (d) {
        this.logContent = d.content || [];
        this.$nextTick(() => {
          const el = this.$refs.logContainer;
          if (el) el.scrollTop = el.scrollHeight;
        });
      }
    },

    toggleLogAutoRefresh() {
      if (this._logRefreshTimer) { clearInterval(this._logRefreshTimer); this._logRefreshTimer = null; }
      if (this.logAutoRefresh) {
        this._logRefreshTimer = setInterval(() => this.loadLogs(), 5000);
      }
    },

    // ── Config ──
    async loadConfig() {
      const d = await this.api('/api/config');
      if (d) { this.cfg = d; this.newPassword = ''; this.cfgSaved = false; }
    },

    async saveConfig() {
      const body = {};
      if (this.cfg.llm_api_key && !this.cfg.llm_api_key.includes('****'))
        body.llm_api_key = this.cfg.llm_api_key;
      if (this.cfg.llm_base_url) body.llm_base_url = this.cfg.llm_base_url;
      if (this.cfg.llm_model) body.llm_model = this.cfg.llm_model;
      if (this.cfg.tushare_token && !this.cfg.tushare_token.includes('****'))
        body.tushare_token = this.cfg.tushare_token;
      if (this.newPassword) body.admin_password = this.newPassword;

      const d = await this.api('/api/config', { method:'PUT', body:JSON.stringify(body) });
      if (d) { this.cfgSaved = true; this.cfgSavedMsg = d.message || '已保存'; }
      setTimeout(() => this.cfgSaved = false, 3000);
    },

    // ── Strategy Config ──
    async loadStrategy() {
      const d = await this.api('/api/strategy-config');
      if (d) this.strategyCfg = d;
    },

    async saveStrategy() {
      const d = await this.api('/api/strategy-config', { method:'PUT', body:JSON.stringify(this.strategyCfg) });
      if (d && d.ok) { this.strategySaved = true; this.strategyMsg = '已保存，实时生效'; this.strategyCfg = d.config; }
      setTimeout(() => this.strategySaved = false, 3000);
    },

    // ── MidLong Strategy Config ──
    async loadMidlong() {
      const d = await this.api('/api/strategy-config/midlong');
      if (d) this.midlongCfg = d;
    },

    async saveMidlong() {
      const d = await this.api('/api/strategy-config/midlong', { method:'PUT', body:JSON.stringify(this.midlongCfg) });
      if (d && d.ok) { this.midlongSaved = true; this.midlongMsg = '已保存，实时生效'; this.midlongCfg = d.config; }
      setTimeout(() => this.midlongSaved = false, 3000);
    },

    // ── Data Sources ──
    async loadDataSources() {
      this.ds.loading = true;
      this.ds.msg = '';
      try {
        const h = this.ds.period;
        const [summary, health, stats, opStats, failures] = await Promise.all([
          this.api('/api/data-sources/summary?hours=' + h),
          this.api('/api/data-sources/health'),
          this.api('/api/data-sources/stats?hours=' + h),
          this.api('/api/data-sources/stats/by-operation?hours=' + h),
          this.api('/api/data-sources/recent-failures?limit=50'),
        ]);
        if (summary) this.ds.summary = summary;
        if (health) this.ds.health = health.sources || [];
        if (stats) this.ds.stats = stats.sources || [];
        if (opStats) this.ds.opStats = opStats.operations || [];
        if (failures) this.ds.failures = failures.failures || [];
      } catch (e) {
        this.ds.msg = '加载失败: ' + e.message;
        this.ds.msgOk = false;
      } finally {
        this.ds.loading = false;
      }
    },

    dsStatOf(name) {
      // 按名称从 stats 数组中查对应统计
      return this.ds.stats.find(s => s.source === name);
    },

    async resetBreaker(name) {
      if (!confirm(`确认重置 ${name} 的熔断器？`)) return;
      try {
        const r = await fetch(`/api/data-sources/${encodeURIComponent(name)}/reset-breaker`, {
          method: 'POST', headers: this.headers(),
        });
        const d = await r.json();
        if (!r.ok) {
          this.ds.msg = d.detail || '重置失败';
          this.ds.msgOk = false;
        } else {
          this.ds.msg = `${name} 熔断已重置`;
          this.ds.msgOk = true;
          await this.loadDataSources();
        }
      } catch (e) {
        this.ds.msg = '请求失败';
        this.ds.msgOk = false;
      }
      setTimeout(() => this.ds.msg = '', 3000);
    },

    async probeAllSources() {
      this.ds.probing = true;
      this.ds.msg = '';
      try {
        const r = await fetch('/api/data-sources/probe', {
          method: 'POST', headers: this.headers(),
        });
        const d = await r.json();
        this.ds.probeResults = d;
        this.ds.msg = '探活完成';
        this.ds.msgOk = true;
        await this.loadDataSources();
      } catch (e) {
        this.ds.msg = '探活失败';
        this.ds.msgOk = false;
      } finally {
        this.ds.probing = false;
        setTimeout(() => this.ds.msg = '', 3000);
      }
    },

    async reloadDataSourceConfig() {
      if (!confirm('确认从 config/data_sources.yaml 热重载配置？')) return;
      try {
        const r = await fetch('/api/data-sources/reload-config', {
          method: 'POST', headers: this.headers(),
        });
        const d = await r.json();
        if (!r.ok) {
          this.ds.msg = d.detail || '重载失败';
          this.ds.msgOk = false;
        } else {
          this.ds.msg = '配置已热重载';
          this.ds.msgOk = true;
          await this.loadDataSources();
        }
      } catch (e) {
        this.ds.msg = '请求失败';
        this.ds.msgOk = false;
      }
      setTimeout(() => this.ds.msg = '', 3000);
    },
  }
}
</script>
